services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    volumes:
      - ../Backend/Plantillas:/app/Plantillas:ro
    restart: unless-stopped
    networks:
      - convenio

  nginx:
    image: nginx:1.27-alpine
    ports:
      # Puerto 8082 por defecto (el 80 suele estar ocupado en el host). Cambie NGINX_PORT en deploy/.env
      - "${NGINX_PORT:-8082}:80"
    volumes:
      - ../Frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - convenio

networks:
  convenio:
    driver: bridge
